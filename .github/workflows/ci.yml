name: Transport checks
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: transport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transport -d transport"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://transport:test-password@localhost:5432/transport
      TEST_DATABASE_URL: postgresql://transport:test-password@localhost:5432/transport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Initialize isolated test database and apply migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/shared/baseline.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/shared/002_api_compat.sql
      - run: npm test
